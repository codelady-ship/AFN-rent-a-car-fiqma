# Render Blueprint for the API in backend/ (free web service, Node + TypeScript build).
# The database is MongoDB Atlas (free M0 cluster): paste its connection string as MONGODB_URI.
services:
  - type: web
    name: afn-rent-a-car-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_ON_START
        value: "true"
