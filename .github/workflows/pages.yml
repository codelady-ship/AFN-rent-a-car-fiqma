# Builds the frontend for GitHub Pages. It only publishes once the owner sets
# Settings -> Pages -> Source to "GitHub Actions". Vercel is the main host (see README).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_BASE: /AFN-rent-a-car-fiqma/
      VITE_SITE_URL: https://codelady-ship.github.io/AFN-rent-a-car-fiqma
      VITE_API_URL: ${{ vars.VITE_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # npm run build also writes 404.html and a copy of index.html per route (park.html, park/demo-1.html, admin.html,
      # ...) with that route's meta tags, so deep links answer 200 (see prerenderRoutes in frontend/vite.config.ts).
      # /admin and /daxil-ol are the portfolio's admin demo links (Pages sends no X-Frame-Options, so they can be framed).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
